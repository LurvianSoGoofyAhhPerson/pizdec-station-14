- type: entity
  name: гондола
  parent: SimpleMobBase
  id: MobBearfoot
  description: Его нейтральное выражение лица показывает принятие мира таким, какой он есть.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: bearfoot
      sprite: _LRVN_TEX/Mobs/Animals/bearfoot.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 5
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags:
    - Bearfoot
  - type: Reproductive
    partnerWhitelist:
      tags:
      - Bearfoot
    offspring:
    - id: MobBearfoot
  - type: ReproductivePartner
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: bearfoot
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeatBearfoot
      amount: 3
  - type: ReplacementAccent
    accent: bearfoot
  - type: InteractionPopup
    successChance: 0.2
    interactSuccessString: Ты гладишь Гондолу по её голове, мягенькой и глупенькой.
    interactFailureString: Ты пытаешься погладить Гондолу, но оно отпрыгивает от тебя.
    interactSuccessSpawn: EffectHearts
  - type: NpcFactionMember
    factions:
    - Passive
  - type: Body
    prototype: AnimalRuminant
  - type: FactionException
  - type: HTN
    rootTask:
      task: RuminantHostileCompound